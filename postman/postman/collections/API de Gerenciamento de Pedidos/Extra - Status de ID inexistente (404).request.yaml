$kind: http-request
url: "{{baseUrl}}/pedidos/999/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "cancelado"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 8000
