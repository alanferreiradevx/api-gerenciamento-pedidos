$kind: http-request
url: "{{baseUrl}}/pedidos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "cliente": "Carlos Silva",
      "tipo": "entrega",
      "valor": 350,
      "prioridade": "normal"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("pedidoId", pm.response.json().id);
    language: text/javascript
order: 1000
